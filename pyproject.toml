[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "syntel-mining"
version = "0.1.0"
description = "Process mining from published methods: inductive miner (infrequent), DECLARE conformance and OCEL 2.0 I/O, in the standard library"
readme = "README.md"
requires-python = ">=3.13,<3.15"
# An SPDX expression (PEP 639). A clean-room implementation of published algorithms: no pm4py code
# (AGPL-3.0-or-later) was read into, copied into or refactored into this package.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Syntel Technologies, Inc." }]
keywords = ["process-mining", "inductive-miner", "declare", "ocel", "conformance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
# No runtime dependencies: a service can mine without inheriting a copyleft closure or a native build.
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.168.0",
    "ruff==0.16.8",
    "pyright==1.1.414",
]

[tool.hatch.build.targets.wheel]
packages = ["src/syntel_mining"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider", "--strict-markers"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "N", "C4", "PIE", "RET"]
# The literature's notation for process trees and fitness: sequence, choice, parallel, loop, silent step, minus.
allowed-confusables = ["×", "−", "→", "∧", "↺", "τ"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src", "tests"]
typeCheckingMode = "strict"
